server:
  port: 8081

spring:
  application:
    name: researchscope
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/researchscope_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

scholarly:
  openalex:
    base-url: https://api.openalex.org
  crossref:
    base-url: https://api.crossref.org
  semanticscholar:
    base-url: https://api.semanticscholar.org/graph/v1
